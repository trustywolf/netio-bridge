---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy
          rustup default stable
          cargo --version
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  # The amd64 and amd64v3 packages for Ubuntu 26.04, built on every push so
  # that a tag finds them working. A v<version> tag also publishes them as a
  # GitHub release.
  deb:
    needs: check
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Package
        run: |
          for variant in amd64 amd64v3; do
            deb=$(packaging/deb.sh "$variant")
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
      - name: Install
        run: |
          for deb in target/*.deb; do
            sudo dpkg -i "$deb"
            test "netio-bridge $(dpkg-deb -f "$deb" Version)" = \
              "$(netio-bridge --version)"
          done
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(dpkg-query -W -f '${Version}' netio-bridge)
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" target/*.deb --verify-tag \
            --title "netio-bridge $version" --generate-notes
